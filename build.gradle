plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rp-r2-uploader" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation include("eu.pb4:polymer-common:${project.polymer_version}")
	implementation include("eu.pb4:polymer-resource-pack:${project.polymer_version}")
	implementation include("eu.pb4:polymer-autohost:${project.polymer_version}")
	// Bundle the transport for dedicated servers, where Minecraft does not provide it.
	implementation include("org.apache.httpcomponents:httpclient:4.5.14")
	include("org.apache.httpcomponents:httpcore:4.4.16")
	include("commons-logging:commons-logging:1.2")
	include("commons-codec:commons-codec:1.11")
}

tasks.register("verifyR2Uploader", JavaExec) {
	group = "verification"
	description = "Verifies R2 uploader URL/key invariants without requiring R2 credentials."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "kim.biryeong.R2ResourcePackUploadTest"
	dependsOn tasks.testClasses
}

tasks.register("uploadR2ResourcePack", JavaExec) {
	group = "upload"
	description = "Uploads a generated Polymer resource pack zip to Cloudflare R2 using the local mod config."
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "kim.biryeong.R2ResourcePackUploadTool"
	dependsOn tasks.classes
	doFirst {
		systemProperty "rpr2uploader.config", providers.gradleProperty("r2ConfigPath").orElse("run/config/rp-r2-uploader.json").get()
		setArgs([providers.gradleProperty("packPath").orElse("run/polymer/resource_pack.zip").get(),
				providers.gradleProperty("packId").orElse("polymer:resources").get()])
	}
}

tasks.register("uploadR2ResourcePacks", JavaExec) {
	group = "upload"
	description = "Uploads the main pack and all configured additional resource packs to R2."
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "kim.biryeong.R2ResourcePackUploadTool"
	dependsOn tasks.classes
	doFirst {
		systemProperty "rpr2uploader.config", providers.gradleProperty("r2ConfigPath").orElse("run/config/rp-r2-uploader.json").get()
		setArgs(["--all", providers.gradleProperty("packPath").orElse("run/polymer/resource_pack.zip").get()])
	}
}

tasks.named("test") {
	failOnNoDiscoveredTests = false
}

tasks.named("check") {
	dependsOn tasks.named("verifyR2Uploader")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(25)
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
